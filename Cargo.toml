[workspace]
members = [
  "apps/cli",
  "apps/mcp-server",
  "crates/artifact-store",
  "crates/environment",
  "crates/git-state",
  "crates/parcel-core",
  "crates/replay",
  "crates/verify",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
ulid = { version = "1.2", features = ["serde"] }
