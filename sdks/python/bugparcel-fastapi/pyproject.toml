[project]
name = "bugparcel-fastapi"
version = "0.1.0"
description = "FastAPI adapter for local BugParcel capture"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
